[package]
name = "cchud"
version = "0.9.0"
edition = "2024"
rust-version = "1.86"
authors = ["Igor Fonin <menotoa1@gmail.com>"]
license = "MIT"
description = "Fast Rust statusline for Claude Code CLI"
repository = "https://github.com/IGoRFonin/cchud"
keywords = ["claude", "claude-code", "statusline", "cli", "terminal"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm", "dep:tempfile"]

[dependencies]
# Hot-path
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Terminal
anstyle = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
terminal_size = "0.4"
supports-color = "3"
anstyle-parse = "0.2"
supports-hyperlinks = "3"

# Phase 3 — CustomCommand subprocess timeout
wait-timeout = "0.2"

# Phase 5 — git via gix (pure Rust, no libgit2 system dep).
gix = { version = "=0.81.0", default-features = false, features = ["max-performance-safe", "sha1", "status"] }

# Phase 5 — Task 7: GitPr HTTP + cache.
# ureq sync HTTP (no async runtime); tls feature = rustls (pure Rust).
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
bincode = "3"

# Phase 6 — JSONL-кэш + transcript-виджеты.
# sonic-rs: ~3× быстрее serde_json на построчном JSONL (бенч в DECISIONS D-2026-04-28).
# Pin major: 0.5 — API стабильно начиная с этого выпуска.
sonic-rs = "0.5"
# SipHash24 для cache-key (~5 KB binary footprint, no extra deps).
siphasher = "1"
# ISO-8601 без std-fmt и serde — экономия binary size; используется только парсером.
time = { version = "0.3", default-features = false, features = ["parsing", "macros"] }

# Phase 7 — FreeMemory widget (no system-side process scan, just memory).
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

# Phase 8 — TUI (optional; default = ["tui"]).
# Pin minor to avoid surprise breaks; ratatui 0.30.x line is stable.
ratatui   = { version = "=0.30.0", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.29.0", optional = true }
# Phase 8 — TUI sample payload uses NamedTempFile (transcript fixture).
tempfile  = { version = "3", optional = true }

[dev-dependencies]
insta = { version = "1", features = ["json", "glob"] }
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"
# Phase 5 T7: HTTP mock for GitPr.
mockito = "1"
# Phase 6 T4: explicit mtime control in append-merge test.
filetime = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
inherits = "release"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
