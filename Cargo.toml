[package]
name = "cchud"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
authors = ["Igor Fonin <menotoa1@gmail.com>"]
license = "MIT"
description = "Fast Rust statusline for Claude Code CLI"
repository = "https://github.com/IGoRFonin/cchud"
keywords = ["claude", "claude-code", "statusline", "cli", "terminal"]
categories = ["command-line-utilities"]
readme = "README.md"

[lib]
path = "src/lib.rs"

[dependencies]
# Hot-path
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Terminal
anstyle = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
terminal_size = "0.4"
supports-color = "3"
anstyle-parse = "0.2"
supports-hyperlinks = "3"

# Phase 3 — CustomCommand subprocess timeout
wait-timeout = "0.2"

# Phase 5 — git via gix (pure Rust, no libgit2 system dep).
gix = { version = "=0.81.0", default-features = false, features = ["max-performance-safe", "sha1", "status"] }

# Phase 5 — Task 7: GitPr HTTP + cache.
# ureq sync HTTP (no async runtime); rustls-tls (pure Rust).
ureq = { version = "2", default-features = false, features = ["json", "tls", "gzip"] }
bincode = "1"

# Test fixtures — GitFixture (used from integration tests; not behind cfg(test)).
tempfile = "3"

# Lazy для виджетов (добавятся в фазе 6)
# sonic-rs, ratatui, crossterm — позже

[dev-dependencies]
insta = { version = "1", features = ["json", "glob"] }
assert_cmd = "2"
predicates = "3"
serial_test = "3"
# Phase 5 T7: HTTP mock for GitPr.
mockito = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
inherits = "release"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
