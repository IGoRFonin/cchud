[package]
name = "cchud"
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.85"
authors = ["Igor Fonin <menotoa1@gmail.com>"]
license = "MIT"
description = "Fast Rust statusline for Claude Code CLI"
repository = "https://github.com/IGoRFonin/cchud"
keywords = ["claude", "claude-code", "statusline", "cli", "terminal"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
# Hot-path
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"

# Terminal
anstyle = "1"
anstream = "1.0"
nu-ansi-term = "0.50"
unicode-width = "0.2"
unicode-segmentation = "1"
terminal_size = "0.4"
supports-color = "3"

# Phase 3 — CustomCommand subprocess timeout
wait-timeout = "0.2"

# Lazy для виджетов (добавятся в фазах 3-7)
# sonic-rs, gix, ureq, bincode, ratatui, crossterm — позже

[dev-dependencies]
insta = { version = "1", features = ["json", "glob"] }
assert_cmd = "2"
predicates = "3"
serial_test = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[profile.bench]
inherits = "release"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
